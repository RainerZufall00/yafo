<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs><linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024"><stop offset="0" stop-color="#3B8BF5"/><stop offset="1" stop-color="#1A5FD0"/></linearGradient>
<clipPath id="card"><rect x="150" y="250" width="520" height="540" rx="96"/></clipPath></defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<!-- Einkaufszettel hinten rechts, leicht gedreht -->
